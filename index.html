<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Number Crunch - Up to 100!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FFF6E5;
            --bean-pink: #FF5964;
            --bean-blue: #35A7FF;
            --bean-yellow: #FFE74C;
            --bean-green: #6BF178;
            --bean-purple: #9B5DE5;
            --dark-outline: #2B2D42;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-cream);
            color: var(--dark-outline);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        .chunky-card {
            background: #FFFFFF;
            border: 5px solid var(--dark-outline);
            box-shadow: 0 8px 0 var(--dark-outline);
            border-radius: 28px;
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .chunky-btn {
            border: 4px solid var(--dark-outline);
            box-shadow: 0 7px 0 var(--dark-outline);
            border-radius: 22px;
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, background-color 0.15s;
            cursor: pointer;
            position: relative;
        }

        .chunky-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 0 var(--dark-outline);
        }

        .chunky-btn:active {
            transform: translateY(5px) scale(0.97);
            box-shadow: 0 2px 0 var(--dark-outline);
        }

        .species-word-pill {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 16px;
            border: 3px solid var(--dark-outline);
            box-shadow: 0 3px 0 var(--dark-outline);
            margin: 0 4px;
            transform: translateY(-2px);
        }

        .answer-option-btn {
            background-color: #FFFFFF;
            color: var(--dark-outline);
            border: 4px solid var(--dark-outline);
            box-shadow: 0 7px 0 var(--dark-outline);
            border-radius: 22px;
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, background-color 0.15s;
            cursor: pointer;
        }

        .answer-option-btn:hover {
            background-color: #FFFDF7;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 0 var(--dark-outline);
        }

        .answer-option-btn:active {
            transform: translateY(5px) scale(0.97);
            box-shadow: 0 2px 0 var(--dark-outline);
        }

        @keyframes squish {
            0%, 100% { transform: scale(1, 1); }
            30% { transform: scale(1.18, 0.85); }
            60% { transform: scale(0.92, 1.12); }
        }

        .animate-squish {
            animation: squish 0.55s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-3deg); }
            40%, 80% { transform: translateX(10px) rotate(3deg); }
        }

        .animate-shake {
            animation: shake 0.45s ease-in-out;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-bean-bounce {
            animation: bounce-slow 1.6s ease-in-out infinite;
        }

        #canvas-wrapper {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            min-height: 220px;
            overflow: hidden;
            cursor: grab;
        }

        #canvas-wrapper:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .polka-bg {
            background-color: #FFF6E5;
            background-image: radial-gradient(#E8DAB2 22%, transparent 22%),
                              radial-gradient(#E8DAB2 22%, transparent 22%);
            background-position: 0 0, 30px 30px;
            background-size: 60px 60px;
        }

        /* Theater Curtains for Memory Mode */
        .curtain-panel {
            background: repeating-linear-gradient(
                90deg,
                #D90429,
                #D90429 28px,
                #EF233C 28px,
                #EF233C 56px
            );
            border-bottom: 8px solid #FFB703;
            box-shadow: inset 0 -12px 0 rgba(0,0,0,0.2);
            transition: transform 0.65s cubic-bezier(0.68, -0.15, 0.26, 1.15);
        }
        .curtain-left {
            border-right: 5px solid var(--dark-outline);
            transform: translateX(-102%);
        }
        .curtain-right {
            border-left: 5px solid var(--dark-outline);
            transform: translateX(102%);
        }
        .curtains-closed .curtain-left {
            transform: translateX(0%);
        }
        .curtains-closed .curtain-right {
            transform: translateX(0%);
        }
    </style>
</head>
<body class="polka-bg select-none">

    <div id="main-menu-modal" class="fixed inset-0 z-50 polka-bg flex flex-col items-center justify-between p-4 sm:p-6 overflow-y-auto">
        <div class="w-full max-w-6xl mx-auto flex flex-col items-center my-auto py-3">
            <div class="chunky-card bg-white px-8 py-4 mb-5 text-center flex items-center gap-4">
                <span class="text-5xl sm:text-6xl animate-bean-bounce">👾</span>
                <div class="text-left">
                    <h1 class="text-3xl sm:text-5xl font-bold text-[#FF5964] tracking-tight leading-none">MONSTER NUMBERS</h1>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 mt-1">CHOOSE A GAME MODE TO PRACTICE UP TO 100!</p>
                </div>
            </div>

            <!-- 10 Game Modes Grid -->
            <div id="modes-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3.5 w-full">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <div id="setup-modal" class="fixed inset-0 z-50 bg-[#2B2D42]/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="chunky-card bg-white p-6 sm:p-8 max-w-lg w-full flex flex-col items-center text-center animate-squish">
            <div id="setup-mode-icon" class="w-16 h-16 rounded-2xl border-4 border-[#2B2D42] flex items-center justify-center text-3xl mb-3 bg-[#FFE74C]">
                👾
            </div>
            <h2 id="setup-mode-title" class="text-2xl sm:text-3xl font-bold text-[#2B2D42] mb-1">Game Mode</h2>
            <p id="setup-mode-desc" class="text-sm font-bold text-slate-500 mb-6">Customize your session settings</p>

            <!-- Time Selection -->
            <div class="w-full mb-5 text-left">
                <label class="block text-xs font-bold text-[#2B2D42] uppercase tracking-wide mb-2">⏱️ Session Time / Watch Time:</label>
                <div class="grid grid-cols-3 gap-2" id="time-options">
                    <button onclick="selectSetupTime(3)" id="time-btn-3" class="chunky-btn py-2 text-sm font-bold bg-white">3 Seconds</button>
                    <button onclick="selectSetupTime(5)" id="time-btn-5" class="chunky-btn py-2 text-sm font-bold bg-[#FFE74C]">5 Seconds</button>
                    <button onclick="selectSetupTime(8)" id="time-btn-8" class="chunky-btn py-2 text-sm font-bold bg-white">8 Seconds</button>
                </div>
            </div>

            <!-- Difficulty Selection -->
            <div class="w-full mb-6 text-left">
                <label class="block text-xs font-bold text-[#2B2D42] uppercase tracking-wide mb-2">🎯 Difficulty & Number Range:</label>
                <div class="grid grid-cols-3 gap-2" id="diff-options">
                    <button onclick="selectSetupDiff(1)" id="diff-btn-1" class="chunky-btn py-2 text-sm font-bold bg-white">Lv. 1 (1-20)</button>
                    <button onclick="selectSetupDiff(2)" id="diff-btn-2" class="chunky-btn py-2 text-sm font-bold bg-[#6BF178]">Lv. 2 (1-50)</button>
                    <button onclick="selectSetupDiff(3)" id="diff-btn-3" class="chunky-btn py-2 text-sm font-bold bg-white">Lv. 3 (1-100)</button>
                </div>
            </div>

            <div class="flex gap-3 w-full">
                <button onclick="closeSetupModal()" class="chunky-btn flex-1 bg-[#FFD6D9] py-3 font-bold text-sm">BACK</button>
                <button onclick="startConfiguredGame()" class="chunky-btn flex-1 bg-[#6BF178] py-3 font-bold text-sm text-[#2B2D42]">START GAME! 🚀</button>
            </div>
        </div>
    </div>

    <header class="w-full px-4 pt-2.5 pb-1 z-20 flex items-center justify-between gap-2 max-w-6xl mx-auto">
        <button onclick="openMainMenu()" class="chunky-btn bg-white px-3.5 py-1.5 text-sm sm:text-base font-bold flex items-center gap-2">
            <span>🏠</span> <span>MODES</span>
            <span id="active-mode-badge" class="hidden sm:inline-block px-2.5 py-0.5 text-xs rounded-full bg-[#FFE74C] border-2 border-[#2B2D42]">Count</span>
        </button>

        <div class="flex items-center gap-2">
            <div id="timer-badge" class="hidden chunky-card !border-4 !shadow-[0_4px_0_#2B2D42] px-3 py-1 items-center gap-1.5 bg-[#FF5964] text-white font-bold text-sm sm:text-base">
                <span>⏱️</span> <span id="timer-val">60s</span>
            </div>

            <div class="chunky-card !border-4 !shadow-[0_4px_0_#2B2D42] px-3 py-1 flex items-center gap-2.5 bg-[#FFE74C]">
                <div class="flex items-center gap-1 font-bold text-sm sm:text-base">
                    <span>⭐</span> <span id="score-val">0</span>
                </div>
                <div class="w-0.5 h-4 bg-[#2B2D42]/30"></div>
                <div class="flex items-center gap-1 font-bold text-sm sm:text-base text-[#FF5964]">
                    <span>🔥</span> <span id="streak-val">0</span>
                </div>
            </div>

            <button onclick="speakCurrentQuestion()" title="Listen" class="chunky-btn bg-[#35A7FF] text-white px-3 py-1.5 text-base font-bold">
                🔊
            </button>
        </div>
    </header>

    <div class="w-full px-4 z-20 max-w-4xl mx-auto mt-1">
        <div id="question-card" class="chunky-card px-4 py-2.5 text-center bg-white flex items-center justify-center min-h-[64px]">
            <h2 id="question-text" class="text-xl sm:text-2xl md:text-3xl font-bold text-[#2B2D42] tracking-wide leading-snug">
                How many Pink Beans?
            </h2>
        </div>
    </div>

    <div id="canvas-wrapper">
        <div id="curtain-container" class="pointer-events-none absolute inset-0 z-20 flex overflow-hidden">
            <div class="curtain-panel curtain-left w-1/2 h-full flex items-center justify-end pr-4">
                <span class="text-5xl sm:text-7xl select-none">🎭</span>
            </div>
            <div class="curtain-panel curtain-right w-1/2 h-full flex items-center justify-start pl-4">
                <span class="text-5xl sm:text-7xl select-none">❓</span>
            </div>
            <div id="curtain-badge" class="opacity-0 transition-opacity duration-300 absolute inset-0 flex items-center justify-center">
                <div class="chunky-card bg-[#FFE74C] px-6 py-4 text-center">
                    <p class="text-2xl sm:text-3xl font-bold text-[#2B2D42]">DO YOU REMEMBER?</p>
                </div>
            </div>
        </div>

        <div id="interactive-counter" class="hidden absolute top-3 left-1/2 -translate-x-1/2 z-10 pointer-events-none">
            <div class="chunky-card !border-4 bg-[#FFE74C] px-4 py-1 flex items-center gap-2 animate-squish">
                <span id="tapped-count-text" class="font-bold text-base sm:text-xl text-[#2B2D42]">10 - Ten!</span>
            </div>
        </div>

        <div class="absolute bottom-3 left-3 z-10 flex gap-1.5 pointer-events-auto">
            <button onclick="resetCameraView()" title="Center Camera" class="chunky-btn bg-white px-3 py-1.5 text-sm font-bold">
                🎥
            </button>
            <button onclick="toggleCloseUpCamera()" id="zoom-toggle-btn" title="Zoom In/Out" class="chunky-btn bg-[#FFE74C] px-3 py-1.5 text-sm font-bold">
                🔍
            </button>
            <button onclick="boingAllMonsters()" title="Jump!" class="chunky-btn bg-[#FF5964] text-white px-3 py-1.5 text-sm font-bold">
                🎉
            </button>
        </div>

        <div id="closeup-controls" class="hidden absolute top-3 right-3 z-10 flex gap-1.5 pointer-events-auto">
            <button onclick="spawnShowcaseSquad(1)" class="chunky-btn bg-white px-3 py-1.5 text-xs font-bold">🥰 1 Bean</button>
            <button onclick="spawnShowcaseSquad(5)" class="chunky-btn bg-white px-3 py-1.5 text-xs font-bold">🥳 5 Beans</button>
            <button onclick="toggleWalkInPlace()" class="chunky-btn bg-[#6BF178] px-3 py-1.5 text-xs font-bold">🐾 Walk</button>
        </div>

        <div id="pack-legend" class="absolute bottom-3 right-3 z-10 pointer-events-none hidden items-center gap-2 bg-white border-4 border-[#2B2D42] px-3 py-1 rounded-2xl shadow-[0_4px_0_#2B2D42]">
            <span id="pack-legend-text" class="text-xs sm:text-sm font-bold text-[#2B2D42]">👑 Giant Bean = 10 | Small = 1</span>
        </div>
    </div>

    <footer class="w-full px-4 pb-3 pt-1 z-20 max-w-6xl mx-auto">
        <div id="answers-grid" class="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-3.5">
            <!-- Populated dynamically -->
        </div>
    </footer>

    <div id="feedback-overlay" class="fixed inset-0 pointer-events-none flex items-center justify-center z-40 opacity-0 transition-opacity duration-200">
        <div id="feedback-box" class="chunky-card bg-[#6BF178] px-8 py-5 text-center max-w-md mx-4 transform scale-75 transition-transform duration-200">
            <div id="feedback-emoji" class="text-5xl mb-1">🎉</div>
            <p id="feedback-word" class="text-2xl sm:text-3xl font-bold text-white drop-shadow-[0_3px_0_#2B2D42]">42 = FORTY-TWO</p>
        </div>
    </div>

    <script>
        const GAME_MODES = [
            { id: 'analyze',  icon: '🔍', title: 'Spot & Count',    desc: 'How many of 1 color?',      bg: '#6BF178' },
            { id: 'walk',     icon: '🏃', title: 'Walking Beans',   desc: 'Count moving beans!',       bg: '#FFE74C' },
            { id: 'memory',   icon: '🎭', title: 'Memory Curtain',  desc: 'Watch, close & remember!',  bg: '#FF5964', lightText: true },
            { id: 'coloradd', icon: '🎨', title: 'Color Plus +',    desc: 'Color A + Color B!',        bg: '#35A7FF', lightText: true },
            { id: 'big100',   icon: '📦', title: 'Big 100 Trays',   desc: 'Tens & ones up to 100!',    bg: '#9B5DE5', lightText: true },
            { id: 'mathadd',  icon: '➕', title: 'Addition Lab',    desc: '3D numbers A + B = ?',      bg: '#6BF178' },
            { id: 'missing',  icon: '🧩', title: 'Missing Piece',   desc: 'Complete A + ? = C',        bg: '#FFE74C' },
            { id: 'mathsub',  icon: '➖', title: 'Minus Pop',       desc: 'Take away A - B = ?',       bg: '#FF5964', lightText: true },
            { id: 'timer',    icon: '⏱️', title: '60s Time Rush',   desc: 'Fast mix challenge!',       bg: '#35A7FF', lightText: true },
            { id: 'closeup',  icon: '🥰', title: 'Meet & Speak',    desc: 'See cute beans up close!',  bg: '#9B5DE5', lightText: true }
        ];

        const ONES_WORDS = [
            "zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
            "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen",
            "seventeen", "eighteen", "nineteen"
        ];
        const TENS_WORDS = [
            "", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"
        ];

        function numberToEnglishWords(n) {
            if (n < 0 || n > 100) return String(n);
            if (n === 100) return "one hundred";
            if (n < 20) return ONES_WORDS[n];
            const ten = Math.floor(n / 10);
            const unit = n % 10;
            return unit === 0 ? TENS_WORDS[ten] : `${TENS_WORDS[ten]}-${ONES_WORDS[unit]}`;
        }

        function capitalizeWords(str) {
            return str.replace(/\b\w/g, c => c.toUpperCase());
        }

        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSfx(type) {
            try {
                ensureAudio();
                const now = audioCtx.currentTime;
                if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.11);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'boing') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(520, now + 0.15);
                    osc.frequency.exponentialRampToValueAtTime(290, now + 0.32);
                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'curtain') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(190, now + 0.45);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.46);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.22, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.36);
                    });
                } else if (type === 'oops') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(130, now + 0.28);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.31);
                }
            } catch (e) {}
        }

        function speakEnglish(text, pitch = 1.15, rate = 0.98) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US';
                utter.pitch = pitch;
                utter.rate = rate;
                window.speechSynthesis.speak(utter);
            } catch (e) {}
        }

        const MONSTER_TYPES = [
            { id: 'pink', singular: 'Pink', plural: 'Pink', color: 0xFF5964, cssColor: '#FF5964', textColor: '#FFFFFF', eyeCount: 2, hasHorns: false, hatColor: 0xFFE74C },
            { id: 'blue', singular: 'Blue', plural: 'Blue', color: 0x35A7FF, cssColor: '#35A7FF', textColor: '#FFFFFF', eyeCount: 1, hasHorns: true, hatColor: 0xFF5964 },
            { id: 'yellow', singular: 'Yellow', plural: 'Yellow', color: 0xFFE74C, cssColor: '#FFE74C', textColor: '#2B2D42', eyeCount: 2, hasHorns: true, hatColor: 0x9B5DE5 },
            { id: 'green', singular: 'Green', plural: 'Green', color: 0x6BF178, cssColor: '#6BF178', textColor: '#2B2D42', eyeCount: 3, hasHorns: false, hatColor: 0x35A7FF },
            { id: 'purple', singular: 'Purple', plural: 'Purple', color: 0x9B5DE5, cssColor: '#9B5DE5', textColor: '#FFFFFF', eyeCount: 2, hasHorns: true, hatColor: 0x6BF178 }
        ];

        function formatColoredSpeciesBadge(monsterType) {
            return `<span class="species-word-pill" style="background-color:${monsterType.cssColor}; color:${monsterType.textColor};">${monsterType.plural}</span>`;
        }

        let scene, camera, renderer, stageGroup;
        let interactiveMeshes = [];
        let animatedBeans = [];
        let confettiParticles = [];
        let raycaster, mouse;

        let isDragging = false;
        let dragMoved = false;
        let prevMouse = { x: 0, y: 0 };
        let targetRotationY = 0;
        let targetRotationX = 0.12;
        let targetCameraZ = 21;
        let targetCameraY = 8.0;
        let isZoomedClose = false;

        // Session Setup State
        let selectedPendingMode = null;
        let setupTime = 5;       // seconds
        let setupDiff = 2;       // 1 = Easy (1-20), 2 = Med (1-50), 3 = Hard (1-100)

        let gameMode = 'analyze';
        let score = 0;
        let streak = 0;
        let currentQuestion = null;
        let tappedCounter = 0;
        let isTransitioning = false;

        let timeLeft = 60;
        let timerInterval = null;
        let memoryTimeout = null;
        let memoryCountdownInterval = null;
        let showcaseWalking = true;

        function renderMainMenuCards() {
            const grid = document.getElementById('modes-grid');
            grid.innerHTML = '';
            GAME_MODES.forEach((m, idx) => {
                const btn = document.createElement('button');
                btn.className = 'chunky-btn p-3.5 sm:p-4 flex flex-col items-center justify-center text-center gap-1.5 bg-white hover:bg-[#FFFDF7]';
                btn.innerHTML = `
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-3 border-[#2B2D42] flex items-center justify-center text-3xl sm:text-4xl mb-1 animate-bean-bounce shadow-[0_4px_0_#2B2D42]" style="background-color:${m.bg};">
                        ${m.icon}
                    </div>

        function makeTextCanvasTexture(text, bgHex, borderHex, textColor = "#2B2D42") {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = borderHex;
            roundRect(ctx, 8, 8, 240, 240, 44);
            ctx.fill();
            ctx.fillStyle = bgHex;
            roundRect(ctx, 22, 22, 212, 212, 34);
            ctx.fill();

            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.arc(95, 52, 18, 0, Math.PI * 2);
            ctx.arc(161, 52, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = borderHex;
            ctx.stroke();

            ctx.fillStyle = borderHex;
            ctx.beginPath();
            ctx.arc(98, 52, 8, 0, Math.PI * 2);
            ctx.arc(164, 52, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = textColor;
            ctx.font = "bold 110px 'Fredoka', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, 128, 152);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

                const onesB = randomInt(1, 4);
                const totalAnswer = (tensA + tensB) * 10 + onesA + onesB;

                const specs = [];
                for (let i = 0; i < tensA; i++) specs.push({ type: colorA, value: 10, scale: 1.48 });
                for (let i = 0; i < onesA; i++) specs.push({ type: colorA, value: 1, scale: 0.85 });
                for (let i = 0; i < tensB; i++) specs.push({ type: colorB, value: 10, scale: 1.48 });
                for (let i = 0; i < onesB; i++) specs.push({ type: colorB, value: 1, scale: 0.85 });

                specs.sort(() => Math.random() - 0.5);
                layoutMonsterSpecs(specs, false);

                return {
                    questionHTML: `How many ${badgeA} + ${badgeB} are there?`,
                    spokenPrompt: `How many ${colorA.plural} plus ${colorB.plural} beans are there?`,
                    correctAnswer: totalAnswer
                };
            }

            document.getElementById('pack-legend').classList.add('hidden');
            const countA = randomInt(3, Math.min(maxR/2, 10));
            const countB = randomInt(2, Math.min(maxR/2, 9));

            const allToSpawn = [];
            for (let i = 0; i < countA; i++) allToSpawn.push(colorA);
            for (let i = 0; i < countB; i++) allToSpawn.push(colorB);
            allToSpawn.sort(() => Math.random() - 0.5);
            layoutIndividualMonsters(allToSpawn, false);

            return {
                questionHTML: `How many ${badgeA} + ${badgeB} do you see?`,
                spokenPrompt: `How many ${colorA.plural} plus ${colorB.plural} beans do you see?`,
                correctAnswer: countA + countB
            };
        }

        function generateBig100Challenge() {
            clearStage();
            const targetType = MONSTER_TYPES[randomInt(0, MONSTER_TYPES.length - 1)];
            const maxR = getMaxRange();
            const totalCount = Math.random() < 0.4 ? randomInt(1, Math.floor(maxR/10)) * 10 : randomInt(21, maxR);
            const tens = Math.floor(totalCount / 10);
            const ones = totalCount % 10;

            layoutTensAndOnes(targetType, tens, ones);

            const badge = formatColoredSpeciesBadge(targetType);
            const legend = document.getElementById('pack-legend');
            document.getElementById('pack-legend-text').textContent = '📦 Tray = 10 | Single = 1';
            legend.classList.remove('hidden');
            legend.classList.add('flex');

            return {
                questionHTML: `How many ${badge} are there?`,
                spokenPrompt: `How many ${targetType.plural} beans are there?`,
                correctAnswer: totalCount
            };
        }

        function layoutIndividualMonsters(speciesList, enableWalking = false) {
            const specs = speciesList.map(mType => ({ type: mType, value: 1, scale: 0.95 }));
            layoutMonsterSpecs(specs, enableWalking);
        }

        function layoutMonsterSpecs(specsList, enableWalking = false) {
            const total = specsList.length;
            const cols = Math.ceil(Math.sqrt(total * 1.35));
            const rows = Math.ceil(total / cols);
            const spacingX = 2.25;
            const spacingZ = 2.1;

            specsList.forEach((spec, index) => {
                const r = Math.floor(index / cols);
                const c = index % cols;
                const x = (c - (cols - 1) / 2) * spacingX + (Math.random() - 0.5) * 0.35;
                const z = (r - (rows - 1) / 2) * spacingZ + (Math.random() - 0.5) * 0.35;

                const bean = createBeanMonsterMesh(spec.type, spec.scale || 0.95, spec.value || 1);
                bean.position.set(x, 0, z);
                bean.userData.isWalking = enableWalking;
                stageGroup.add(bean);
            });
        }

        function layoutTensAndOnes(monsterType, tensCount, onesCount) {
            const trayCols = Math.min(tensCount, 5);
            const traySpacingX = 3.65;
            const traySpacingZ = 2.25;

            for (let t = 0; t < tensCount; t++) {
                const row = Math.floor(t / 5);
                const col = t % 5;
                const pod = createTenPackTray(monsterType);
                const px = (col - (trayCols - 1) / 2) * traySpacingX;
                const pz = -2.2 + row * traySpacingZ;
                pod.position.set(px, 0, pz);
                stageGroup.add(pod);
            }

            const onesSpacingX = 1.75;
            for (let u = 0; u < onesCount; u++) {
                const singleBean = createBeanMonsterMesh(monsterType, 0.9, 1);
                const ux = (u - (onesCount - 1) / 2) * onesSpacingX;
                const uz = tensCount > 5 ? 3.2 : 1.8;
                singleBean.position.set(ux, 0, uz);
                stageGroup.add(singleBean);
            }
        }

        function generateMathChallenge(forcedKind = 'add') {
            clearStage();
            document.getElementById('pack-legend').classList.add('hidden');
            const maxR = getMaxRange();

            let a, b, op, result, missingPos;

            if (forcedKind === 'add') {
                op = '+';
                result = randomInt(10, maxR);
                a = randomInt(3, result - 2);
                b = result - a;
                missingPos = 'result';
            } else if (forcedKind === 'missing') {
                op = '+';
                result = randomInt(12, maxR);
                a = randomInt(4, result - 3);
                b = result - a;
                missingPos = Math.random() < 0.5 ? 'second' : 'first';
            } else {
                op = '-';
                a = randomInt(12, maxR);
                b = randomInt(3, a - 3);
                result = a - b;
                missingPos = 'result';
            }

            const tokens = [
                { text: missingPos === 'first' ? '?' : String(a), color: missingPos === 'first' ? '#FFE74C' : '#FF5964', speak: missingPos === 'first' ? 'what number' : numberToEnglishWords(a) },
                { text: op, color: '#35A7FF', speak: op === '+' ? 'plus' : 'minus' },
                { text: missingPos === 'second' ? '?' : String(b), color: missingPos === 'second' ? '#FFE74C' : '#6BF178', speak: missingPos === 'second' ? 'what number' : numberToEnglishWords(b) },
                { text: '=', color: '#9B5DE5', speak: 'equals' },
                { text: missingPos === 'result' ? '?' : String(result), color: missingPos === 'result' ? '#FFE74C' : '#FF5964', speak: missingPos === 'result' ? 'how many' : numberToEnglishWords(result) }
            ];

            const spacing = 3.25;
            tokens.forEach((tok, idx) => {
                const block = createMonsterNumberBlock(tok.text, tok.color, tok.speak);
                block.position.set((idx - 2) * spacing, 0, -0.5);
                stageGroup.add(block);
            });

            for (let i = 0; i < 4; i++) {
                const mType = MONSTER_TYPES[i % MONSTER_TYPES.length];
                const fan = createBeanMonsterMesh(mType, 0.72, 1);
                fan.position.set((i - 1.5) * 3.4, 0, 3.2);
                stageGroup.add(fan);
            }

            let answerValue = result;
            let spokenEquation = '';
            let displayPrompt = '';

            if (missingPos === 'result') {
                answerValue = result;
                const opWord = op === '+' ? 'plus' : 'minus';
                displayPrompt = `${a} ${op} ${b} = ?`;
                spokenEquation = `How much is ${numberToEnglishWords(a)} ${opWord} ${numberToEnglishWords(b)}?`;
            } else if (missingPos === 'second') {
                answerValue = b;
                displayPrompt = `${a} + ? = ${result}`;
                spokenEquation = `${numberToEnglishWords(a)} plus what number equals ${numberToEnglishWords(result)}?`;
            } else {
                answerValue = a;
                displayPrompt = `? + ${b} = ${result}`;
                spokenEquation = `What number plus ${numberToEnglishWords(b)} equals ${numberToEnglishWords(result)}?`;
            }

            return { questionHTML: displayPrompt, spokenPrompt: spokenEquation, correctAnswer: answerValue };
        }

        function setupCloseUpMode() {
            spawnShowcaseSquad(5);
            isZoomedClose = true;
            targetCameraZ = 10.5;
            targetCameraY = 3.4;
            targetRotationY = 0;
            targetRotationX = 0.05;
            document.getElementById('pack-legend').classList.add('hidden');
            document.getElementById('question-text').innerHTML = 'Tap a Bean to Count & Speak!';
            document.getElementById('answers-grid').innerHTML = '';

            const grid = document.getElementById('answers-grid');
            const funNumbers = [10, 25, 50, 100];
            funNumbers.forEach(n => {
                const word = capitalizeWords(numberToEnglishWords(n));
                const btn = document.createElement('button');
                btn.className = 'answer-option-btn py-2 px-3 flex flex-col items-center justify-center text-center';
                btn.innerHTML = `
                    <span class="text-2xl sm:text-3xl font-bold text-[#2B2D42]">${n}</span>
                    <span class="text-xs sm:text-sm font-bold px-2.5 py-0.5 rounded-full bg-[#FFE74C] text-[#2B2D42] border-2 border-[#2B2D42] mt-0.5">${word}</span>
                `;
                btn.onclick = () => {
                    tappedCounter = n;

                    document.getElementById('tapped-count-text').textContent = `${n} - ${word}!`;
                    pill.classList.remove('hidden');
                    speakEnglish(word, 1.2, 1.0);

                    spawn3DConfetti();

        function spawnShowcaseSquad(count = 5) {
            clearStage();
            if (count === 1) {
                const mType = MONSTER_TYPES[randomInt(0, MONSTER_TYPES.length - 1)];
                const giantBean = createBeanMonsterMesh(mType, 1.85, 1);
                giantBean.position.set(0, 0, 1.2);
                giantBean.userData.isWalking = showcaseWalking;
                stageGroup.add(giantBean);
                speakEnglish(`Hello! I am a ${mType.singular} bean!`, 1.25, 1.0);
            } else {
                MONSTER_TYPES.forEach((mType, idx) => {
                    const bean = createBeanMonsterMesh(mType, 1.25, 1);
                    const angle = ((idx - 2) * 0.42);
                    bean.position.set(Math.sin(angle) * 5.2, 0, Math.cos(angle) * 2.2);
                    bean.userData.isWalking = showcaseWalking;
                    stageGroup.add(bean);
                });
            }
            boingAllMonsters(0.22);
        }

        function toggleWalkInPlace() {
            showcaseWalking = !showcaseWalking;
            animatedBeans.forEach(b => { b.userData.isWalking = showcaseWalking; });
            playSfx('pop');
        }

        function nextRound() {
            isTransitioning = false;
            clearMemoryTimers();
            setCurtainsClosed(false);

            if (gameMode === 'closeup') {
                setupCloseUpMode();
                return;
            }

            if (gameMode === 'memory') {
                startMemoryCurtainRound();
                return;
            }

            if (!isZoomedClose) {
                resetCameraView();
            }

            if (gameMode === 'analyze') {
                currentQuestion = generateSingleColorCountChallenge(false);
            } else if (gameMode === 'walk') {
                currentQuestion = generateSingleColorCountChallenge(true);
            } else if (gameMode === 'coloradd') {
                currentQuestion = generateColorAdditionChallenge();
            } else if (gameMode === 'big100') {
                currentQuestion = generateBig100Challenge();
            } else if (gameMode === 'mathadd') {
                currentQuestion = generateMathChallenge('add');
            } else if (gameMode === 'missing') {
                currentQuestion = generateMathChallenge('missing');
            } else if (gameMode === 'mathsub') {
                currentQuestion = generateMathChallenge('sub');
            } else if (gameMode === 'timer') {
                const mix = ['analyze', 'walk', 'coloradd', 'big100', 'mathadd', 'missing'];
                const pick = mix[randomInt(0, mix.length - 1)];
                if (pick === 'analyze') currentQuestion = generateSingleColorCountChallenge(false);
                else if (pick === 'walk') currentQuestion = generateSingleColorCountChallenge(true);
                else if (pick === 'coloradd') currentQuestion = generateColorAdditionChallenge();
                else if (pick === 'big100') currentQuestion = generateBig100Challenge();
                else if (pick === 'mathadd') currentQuestion = generateMathChallenge('add');
                else currentQuestion = generateMathChallenge('missing');
            }

            document.getElementById('question-text').innerHTML = currentQuestion.questionHTML;
            renderAnswerChoices(currentQuestion.correctAnswer);
            boingAllMonsters();

            setTimeout(() => {
                speakCurrentQuestion();
            }, 200);
        }

        function speakCurrentQuestion() {
            if (!currentQuestion) return;
            speakEnglish(currentQuestion.spokenPrompt || "How many?");
        }

        function renderAnswerChoices(correctVal) {
            const choices = new Set([correctVal]);
            const isExactTen = (correctVal % 10 === 0);
            const maxR = getMaxRange();

            const candidates = isExactTen
                ? [correctVal + 10, correctVal - 10, correctVal + 20, correctVal - 20, correctVal + 30, correctVal - 30]
                : [correctVal + 10, correctVal - 10, correctVal + 1, correctVal - 1, correctVal + 2, correctVal - 2];

            candidates.sort(() => Math.random() - 0.5);
            for (const c of candidates) {
                if (choices.size >= 4) break;
                if (c >= 1 && c <= maxR && !choices.has(c)) {
                    choices.add(c);
                }
            }

            while (choices.size < 4) {
                const rand = isExactTen ? randomInt(1, Math.floor(maxR/10)) * 10 : randomInt(1, maxR);
                if (!choices.has(rand)) choices.add(rand);
            }

            const finalOptions = Array.from(choices).sort(() => Math.random() - 0.5);
            const optionLetters = ['A', 'B', 'C', 'D'];
            const grid = document.getElementById('answers-grid');
            grid.innerHTML = '';

            finalOptions.forEach((num, idx) => {
                const word = capitalizeWords(numberToEnglishWords(num));
                const btn = document.createElement('button');
                btn.className = 'answer-option-btn py-2 px-3 flex flex-col items-center justify-center text-center relative group';

                btn.innerHTML = `
                    <span class="absolute top-2 left-2.5 w-6 h-6 rounded-full bg-[#FFF6E5] border-2 border-[#2B2D42] text-xs font-bold flex items-center justify-center text-[#2B2D42]">
                        ${optionLetters[idx]}
                    </span>
                    <span class="text-2xl sm:text-3xl md:text-4xl font-bold leading-none tracking-tight text-[#2B2D42]">${num}</span>
                    <span class="text-xs sm:text-sm font-bold mt-1 px-3 py-0.5 rounded-full bg-[#FFF6E5] text-[#2B2D42] border-2 border-[#2B2D42]">
                        ${word}
                    </span>
                `;

                btn.onclick = () => checkUserAnswer(num, btn);
                grid.appendChild(btn);
            });
        }

        function checkUserAnswer(selectedNum, btnElement) {
            if (isTransitioning) return;
            const engWord = numberToEnglishWords(selectedNum);

            if (selectedNum === currentQuestion.correctAnswer) {
                isTransitioning = true;
                score += 10 + streak * 2;
                streak += 1;
                updateScoreUI();

                if (gameMode === 'memory') setCurtainsClosed(false);

                playSfx('win');
                btnElement.style.backgroundColor = '#6BF178';
                btnElement.classList.add('animate-squish');
                speakEnglish(`${engWord}!`, 1.2, 1.05);

                spawn3DConfetti();
                boingAllMonsters(0.32);
                showFeedbackOverlay(selectedNum, capitalizeWords(engWord));

                const delayMs = gameMode === 'timer' ? 1100 : 1750;
                setTimeout(() => {
                    hideFeedbackOverlay();
                    nextRound();
                }, delayMs);
            } else {
                streak = 0;
                updateScoreUI();
                playSfx('oops');
                btnElement.classList.add('animate-shake');
                btnElement.style.backgroundColor = '#FFD6D9';
                btnElement.style.opacity = '0.6';
                speakEnglish(`${engWord}? Try again!`, 1.05, 1.0);

                setTimeout(() => {
                    btnElement.classList.remove('animate-shake');
                }, 500);
            }
        }

        function startTimerMode() {
            stopTimerMode();
            timeLeft = 60;
            const badge = document.getElementById('timer-badge');
            badge.classList.remove('hidden');
            badge.classList.add('flex');
            document.getElementById('timer-val').textContent = `${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').textContent = `${timeLeft}s`;
                if (timeLeft <= 0) {
                    stopTimerMode();
                    playSfx('win');
                    speakEnglish(`Time is up! Score ${score}!`, 1.15, 1.0);
                    showFeedbackOverlay(score, "TIME'S UP!");
                    setTimeout(() => {
                        hideFeedbackOverlay();
                        startTimerMode();
                        nextRound();
                    }, 2800);
                }
            }, 1000);
        }

        function stopTimerMode() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            const badge = document.getElementById('timer-badge');
            badge.classList.add('hidden');
            badge.classList.remove('flex');
        }

        function setGameMode(mode) {
            gameMode = mode;
            clearMemoryTimers();
            stopTimerMode();
            setCurtainsClosed(false);

            const modeObj = GAME_MODES.find(m => m.id === mode);
            if (modeObj) {
                document.getElementById('active-mode-badge').textContent = `${modeObj.icon} ${modeObj.title}`;
            }

            const closeupControls = document.getElementById('closeup-controls');
            if (mode === 'closeup') {
                closeupControls.classList.remove('hidden');
            } else {
                closeupControls.classList.add('hidden');
                isZoomedClose = false;
            }

            if (mode === 'timer') {
                score = 0;
                streak = 0;
                updateScoreUI();
                startTimerMode();
            }

            playSfx('pop');
            nextRound();
        }

        function setupPointerControls(domElement) {
            domElement.addEventListener('pointerdown', e => {
                isDragging = true;
                dragMoved = false;
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
            });

            window.addEventListener('pointermove', e => {
                if (!isDragging) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
                targetRotationY += dx * 0.007;
                targetRotationX = Math.max(-0.25, Math.min(0.65, targetRotationX + dy * 0.005));
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
            });

            window.addEventListener('pointerup', e => {
                if (isDragging && !dragMoved) handleCanvasTap(e);
                isDragging = false;
            });

            domElement.addEventListener('wheel', e => {
                e.preventDefault();
                targetCameraZ = Math.max(7.5, Math.min(26, targetCameraZ + e.deltaY * 0.012));
                targetCameraY = Math.max(2.6, Math.min(10, targetCameraZ * 0.36));
            }, { passive: false });
        }

        function toggleCloseUpCamera() {
            isZoomedClose = !isZoomedClose;
            if (isZoomedClose) {
                targetCameraZ = 10.5;
                targetCameraY = 3.5;
                targetRotationX = 0.04;
            } else {
                targetCameraZ = 21;
                targetCameraY = 8.0;
                targetRotationX = 0.14;
            }
            playSfx('pop');
        }

        function resetCameraView() {
            targetRotationY = 0;
            targetRotationX = isZoomedClose ? 0.04 : 0.14;
            targetCameraZ = isZoomedClose ? 10.5 : 21;
            targetCameraY = isZoomedClose ? 3.5 : 8.0;
        }

        function handleCanvasTap(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveMeshes, false);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const beanGroup = hitMesh.userData.parentBean;
                if (beanGroup && beanGroup.userData) {
                    beanGroup.userData.jumpVel = 0.24;
                    playSfx('boing');

                    if (beanGroup.userData.isMathBlock) {
                        speakEnglish(String(beanGroup.userData.countValue), 1.15, 1.0);
                    } else {
                        const addVal = beanGroup.userData.countValue || 1;
                        tappedCounter += addVal;
                        if (tappedCounter > 100) tappedCounter = addVal;

                        const engWord = capitalizeWords(numberToEnglishWords(tappedCounter));
                        const pill = document.getElementById('interactive-counter');
                        document.getElementById('tapped-count-text').textContent = `${tappedCounter} - ${engWord}!`;
                        pill.classList.remove('hidden');
                        speakEnglish(engWord, 1.2, 1.05);
                    }
                }
            }
        }

        function boingAllMonsters(strength = 0.2) {
            playSfx('boing');
            animatedBeans.forEach((b, idx) => {
                setTimeout(() => {
                    if (b && b.userData) b.userData.jumpVel = strength + Math.random() * 0.08;
                }, idx * 18);
            });
        }

        function spawn3DConfetti() {
            const colors = [0xFF5964, 0x35A7FF, 0xFFE74C, 0x6BF178, 0x9B5DE5];
            const geo = new THREE.BoxGeometry(0.32, 0.32, 0.32);
            for (let i = 0; i < 40; i++) {
                const mat = new THREE.MeshBasicMaterial({ color: colors[i % colors.length] });
                const p = new THREE.Mesh(geo, mat);
                p.position.set((Math.random() - 0.5) * 6, 2 + Math.random() * 2, (Math.random() - 0.5) * 4);
                p.userData = {
                    vel: new THREE.Vector3((Math.random() - 0.5) * 0.32, 0.15 + Math.random() * 0.25, (Math.random() - 0.5) * 0.32),
                    rotVel: new THREE.Vector3(Math.random() * 0.2, Math.random() * 0.2, Math.random() * 0.2),
                    life: 70
                };
                scene.add(p);
                confettiParticles.push(p);
            }
        }

        function updateScoreUI() {
            document.getElementById('score-val').textContent = score;
            document.getElementById('streak-val').textContent = streak;
        }

        function showFeedbackOverlay(numVal, wordStr) {

        function onWindowResize() {
            const container = document.getElementById('canvas-wrapper');
            if (!container || !renderer || !camera) return;
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            const time = performance.now() * 0.003;

            if (camera) {
                camera.position.z += (targetCameraZ - camera.position.z) * 0.08;
                camera.position.y += (targetCameraY - camera.position.y) * 0.08;
                camera.lookAt(0, isZoomedClose ? 0.9 : 0.5, 0);
            }

            if (stageGroup) {
                stageGroup.rotation.y += (targetRotationY - stageGroup.rotation.y) * 0.1;
                stageGroup.rotation.x += (targetRotationX - stageGroup.rotation.x) * 0.1;
            }

            for (let i = 0; i < animatedBeans.length; i++) {
                const bean = animatedBeans[i];
                const ud = bean.userData;

                if (ud.jumpVel !== 0 || ud.jumpOffset > 0) {
                    ud.jumpOffset += ud.jumpVel;
                    ud.jumpVel -= 0.015;
                    if (ud.jumpOffset <= 0) {
                        ud.jumpOffset = 0;
                        ud.jumpVel = 0;
                    }
                }

                let waddleTilt = 0;
                if (ud.isWalking) {
                    const stepCycle = time * 4.5 + ud.phase;
                    waddleTilt = Math.sin(stepCycle) * 0.14;

                    if (ud.leftFoot && ud.rightFoot) {
                        ud.leftFoot.position.y = -0.25 + Math.max(0, Math.sin(stepCycle) * 0.18);
                        ud.rightFoot.position.y = -0.25 + Math.max(0, -Math.sin(stepCycle) * 0.18);
                    }

                    if (gameMode !== 'closeup') {
                        bean.position.x += Math.sin(ud.walkAngle) * ud.walkSpeed;
                        bean.position.z += Math.cos(ud.walkAngle) * ud.walkSpeed;

                        const distFromCenter = Math.hypot(bean.position.x, bean.position.z);
                        if (distFromCenter > 8.6) {
                            ud.walkAngle = Math.atan2(-bean.position.x, -bean.position.z) + (Math.random() - 0.5) * 0.8;
                        } else if (Math.random() < 0.012) {
                            ud.walkAngle += (Math.random() - 0.5) * 1.2;
                        }

                        for (let j = i + 1; j < animatedBeans.length; j++) {
                            const other = animatedBeans[j];
                            const dx = bean.position.x - other.position.x;
                            const dz = bean.position.z - other.position.z;
                            const d = Math.hypot(dx, dz);
                            const minDist = ((bean.userData.baseScale || 1) + (other.userData.baseScale || 1)) * 0.72;
                            if (d > 0 && d < minDist) {
                                const push = (minDist - d) * 0.045;
                                bean.position.x += (dx / d) * push;
                                bean.position.z += (dz / d) * push;
                                other.position.x -= (dx / d) * push;
                                other.position.z -= (dz / d) * push;
                            }
                        }
                    }
                }

                const baseS = ud.baseScale || 1;
                const breathe = Math.sin(time * 2.2 + ud.phase) * 0.04;
                const stretch = ud.jumpOffset * 0.18;

                bean.position.y = (ud.baseY || 0) + ud.jumpOffset + (ud.isWalking ? Math.abs(Math.sin(time * 4.5 + ud.phase)) * 0.12 : 0);
                bean.rotation.z = waddleTilt;
                bean.scale.set(
                    baseS * (1 - breathe - stretch * 0.4),
                    baseS * (1 + breathe + stretch),
                    baseS * (1 - breathe - stretch * 0.4)
                );
            }

            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.position.add(p.userData.vel);
                p.userData.vel.y -= 0.009;
                p.rotation.x += p.userData.rotVel.x;
                p.rotation.y += p.userData.rotVel.y;
                p.userData.life--;
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    confettiParticles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = function () {
            renderMainMenuCards();
            initThreeScene();
            nextRound();
            animateLoop();
        };
    </script>
</body>
</html>
